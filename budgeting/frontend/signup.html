<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NottsBank — Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <nav><h1>NottsBank Budgeting Tracker</h1></nav>
  <div class="login-wrap">
    <div class="login-card">
      <h2>Create your account</h2>
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="first-name" placeholder="e.g. Alice" autocomplete="first-name">
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="last-name" placeholder="e.g. Smith" autocomplete="last-name">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Your email" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="e.g. alice" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
      </div>
      <button onclick="doSignUp()">Sign Up</button>
      <div class="login-link">
        Existing user? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>
  <script src="signup.js"></script>
</body>
</html>
